<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snake Arcade</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  background:#0b1424;
  color:white;
  font-family:Arial,sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:12px;
}
main{width:100%;max-width:500px;text-align:center}
h1{color:#65f5a3;margin:10px 0}
p{color:#afc1d4}
.scores{display:flex;gap:10px;margin:15px 0}
.score{
  flex:1;background:#192b43;
  padding:12px;border-radius:12px;
}
.score strong{
  display:block;color:#ffd45d;
  font-size:30px;margin-top:5px;
}
.board{
  position:relative;width:100%;
  aspect-ratio:1;
  border:3px solid #436586;
  border-radius:12px;
  overflow:hidden;
}
canvas{display:block;width:100%;height:100%;touch-action:none}
.overlay{
  position:absolute;inset:0;
  background:rgba(5,15,30,.95);
  display:flex;flex-direction:column;
  justify-content:center;align-items:center;
  padding:20px;gap:12px;
}
.overlay.hidden{display:none}
.overlay h2{color:#65f5a3}
button{
  background:#65f5a3;color:#09271b;
  border:0;border-radius:10px;
  padding:13px 20px;font-size:16px;
  font-weight:bold;cursor:pointer;
  touch-action:manipulation;
}
button:active{transform:scale(.95)}
button:focus-visible{
  outline:3px solid #ffd45d;
  outline-offset:3px;
}
.actions{
  display:flex;justify-content:center;
  gap:10px;margin:15px 0;
}
.actions button{background:#294666;color:white}
.controls{
  display:grid;
  grid-template-columns:repeat(3,60px);
  gap:7px;justify-content:center;
  margin:15px auto;
}
.controls button{
  background:#294666;color:white;
  font-size:24px;padding:12px;
}
.up{grid-column:2}
.left{grid-column:1;grid-row:2}
.down{grid-column:2;grid-row:2}
.right{grid-column:3;grid-row:2}
.help{font-size:13px;line-height:1.7}
</style>
</head>
<body>
<main>
<h1>🐍 SNAKE ARCADE</h1>
<p>O clássico jogo da cobrinha</p>


<div class="scores">
  <div class="score">
    PONTUAÇÃO
    <strong id="score">0</strong>
  </div>
  <div class="score">
    RECORDE
    <strong id="best">0</strong>
  </div>
</div>


<div class="board">
  <canvas id="game" width="600" height="600"></canvas>
  <div class="overlay" id="overlay">
    <h2 id="title">SNAKE GAME</h2>
    <p id="message">Coma as frutas e evite colisões!</p>
    <button id="start">COMEÇAR JOGO</button>
  </div>
</div>


<div class="actions">
  <button id="pause">Pausar</button>
  <button id="restart">Reiniciar</button>
</div>


<div class="controls">
  <button class="up" data-dir="up">▲</button>
  <button class="left" data-dir="left">◀</button>
  <button class="down" data-dir="down">▼</button>
  <button class="right" data-dir="right">▶</button>
</div>


<p id="status">Pronto para jogar!</p>
<p class="help">
  Setas ou W A S D para movimentar<br>
  Espaço para pausar<br>
  No celular, use os botões ou deslize na tela.
</p>
</main>


<script>
"use strict";


const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const get = id => document.getElementById(id);


const overlay = get("overlay");
const title = get("title");
const message = get("message");
const startButton = get("start");
const pauseButton = get("pause");


const grid = 20;
const cell = 30;


const vectors = {
  up:{x:0,y:-1},
  down:{x:0,y:1},
  left:{x:-1,y:0},
  right:{x:1,y:0}
};


let snake = [];
let food = null;
let direction = vectors.right;
let nextDirection = vectors.right;
let queued = false;
let score = 0;
let best = 0;
let state = "ready";
let lastTime = 0;
let elapsed = 0;


try {
  best = Number(localStorage.getItem("snakeRecord")) || 0;
} catch(e) {}


get("best").textContent = best;


function updateScore() {
  get("score").textContent = score;
  if(score > best) {
    best = score;
    get("best").textContent = best;
    try {
      localStorage.setItem("snakeRecord", best);
    } catch(e) {}
  }
}


function generateFood() {
  const available = [];
  for(let y=0;y<grid;y++) {
    for(let x=0;x<grid;x++) {
      if(!snake.some(p=>p.x===x && p.y===y)) {
        available.push({x,y});
      }
    }
  }
  if(!available.length) return null;
  return available[Math.floor(Math.random()*available.length)];
}


function startGame() {
  snake = [
    {x:8,y:10},
    {x:7,y:10},
    {x:6,y:10}
  ];
  direction = vectors.right;
  nextDirection = vectors.right;
  queued = false;
  score = 0;
  elapsed = 0;
  lastTime = 0;
  state = "playing";
  food = generateFood();
  updateScore();
  overlay.classList.add("hidden");
  pauseButton.textContent = "Pausar";
  get("status").textContent = "Boa sorte!";
  render();
}


function endGame(won=false) {
  state = "over";
  overlay.classList.remove("hidden");
  title.textContent = won ? "VOCÊ VENCEU!" : "GAME OVER";
  message.textContent = "Pontuação: " + score + " | Recorde: " + best;
  startButton.textContent = "JOGAR NOVAMENTE";
  get("status").textContent = "Partida finalizada";
}


function togglePause() {
  if(state==="playing") {
    state="paused";
    overlay.classList.remove("hidden");
    title.textContent="PAUSADO";
    message.textContent="Toque em continuar para voltar.";
    startButton.textContent="CONTINUAR";
    pauseButton.textContent="Continuar";
  } else if(state==="paused") {
    state="playing";
    elapsed=0;
    lastTime=0;
    overlay.classList.add("hidden");
    pauseButton.textContent="Pausar";
  }
}


function setDirection(name) {
  if(state!=="playing" || queued) return;
  const d=vectors[name];
  if(!d) return;
  if(d.x===-direction.x && d.y===-direction.y) return;
  nextDirection=d;
  queued=true;
}


function update() {
  direction=nextDirection;
  queued=false;


  const head={
    x:snake[0].x+direction.x,
    y:snake[0].y+direction.y
  };


  if(head.x<0 || head.y<0 ||
     head.x>=grid || head.y>=grid) {
    endGame();
    return;
  }


  const eating=food &&
    head.x===food.x && head.y===food.y;


  const body=eating ? snake : snake.slice(0,-1);


  if(body.some(p=>p.x===head.x && p.y===head.y)) {
    endGame();
    return;
  }


  snake.unshift(head);


  if(eating) {
    score+=10;
    updateScore();
    food=generateFood();
    if(!food) endGame(true);
  } else {
    snake.pop();
  }
}


function drawCell(x,y,color,inset=2) {
  ctx.fillStyle=color;
  ctx.fillRect(
    x*cell+inset,
    y*cell+inset,
    cell-inset*2,
    cell-inset*2
  );
}


function render() {
  ctx.fillStyle="#0c1b2b";
  ctx.fillRect(0,0,600,600);


  ctx.strokeStyle="rgba(255,255,255,.045)";
  for(let i=0;i<=grid;i++) {
    ctx.beginPath();
    ctx.moveTo(i*cell,0);
    ctx.lineTo(i*cell,600);
    ctx.moveTo(0,i*cell);
    ctx.lineTo(600,i*cell);
    ctx.stroke();
  }


  if(food) drawCell(food.x,food.y,"#ff647e",5);


  snake.forEach((p,i)=>{
    drawCell(p.x,p.y,i===0?"#b0ffd0":"#65f5a3");
  });
}


function loop(time) {
  if(state==="playing") {
    if(!lastTime) lastTime=time;
    elapsed+=Math.min(time-lastTime,250);


    const speed=Math.max(75,155-score*.3);


    if(elapsed>=speed) {
      elapsed-=speed;
      update();
    }
  } else {
    elapsed=0;
  }


  lastTime=time;
  render();
  requestAnimationFrame(loop);
}


startButton.addEventListener("click",()=>{
  if(state==="paused") togglePause();
  else startGame();
});


get("restart").addEventListener("click",startGame);
pauseButton.addEventListener("click",togglePause);


document.querySelectorAll("[data-dir]").forEach(button=>{
  button.addEventListener("click",()=>{
    setDirection(button.dataset.dir);
  });
});


document.addEventListener("keydown",event=>{
  const key=event.key.toLowerCase();
  const keys={
    arrowup:"up",w:"up",
    arrowdown:"down",s:"down",
    arrowleft:"left",a:"left",
    arrowright:"right",d:"right"
  };


  if(keys[key]) {
    event.preventDefault();
    setDirection(keys[key]);
  }


  if(event.code==="Space") {
    event.preventDefault();
    if(!event.repeat) togglePause();
  }
});


let touchX=0;
let touchY=0;


canvas.addEventListener("touchstart",e=>{
  touchX=e.changedTouches[0].clientX;
  touchY=e.changedTouches[0].clientY;
},{passive:true});


canvas.addEventListener("touchend",e=>{
  const dx=e.changedTouches[0].clientX-touchX;
  const dy=e.changedTouches[0].clientY-touchY;


  if(Math.max(Math.abs(dx),Math.abs(dy))<20) return;


  if(Math.abs(dx)>Math.abs(dy)) {
    setDirection(dx>0?"right":"left");
  } else {
    setDirection(dy>0?"down":"up");
  }
},{passive:true});


document.addEventListener("visibilitychange",()=>{
  if(document.hidden && state==="playing") togglePause();
});


render();
requestAnimationFrame(loop);
</script>
</body>
</html>
